name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install pinned Python and dependencies
        run: |
          uv python install 3.10.20
          uv venv --python 3.10.20 .venv
          uv pip install --python "$PYTHON" -r requirements-benchmark.txt
      - name: Verify clean checkout
        run: bash scripts/verify_parc_release.sh
      - name: Verify source archive without Git metadata
        shell: bash
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          bash "$archive_dir/scripts/verify_parc_release.sh"
      - name: Ensure tests did not modify release files
        run: git diff --exit-code
